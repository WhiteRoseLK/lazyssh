name: "💡 Feature Request"
description: Suggest an idea or improvement for neossh
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make neossh better! Please describe the feature you'd like to see.

  - type: checkboxes
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched the [existing issues](https://github.com/WhiteRoseLK/neossh/issues) to ensure this feature has not already been requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is (e.g. "I'm always frustrated when...").
      placeholder: Describe the pain point or problem...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen and how you envision it working.
      placeholder: I would like neossh to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, CLI examples, mockups, or screenshots about the feature request here.
    validations:
      required: false